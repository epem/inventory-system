service: inventory-system

frameworkVersion: '4'

plugins:
  - serverless-dynamodb
  - serverless-offline

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:AWS_REGION, 'us-east-1'}
  environment:
    AWS_REGION: ${self:provider.region}
    DYNAMODB_TABLE_PRODUCTS: ${self:service}-products-${opt:stage, 'dev'}
    DYNAMODB_TABLE_ORDERS: ${self:service}-orders-${opt:stage, 'dev'}

functions:
  app:
    handler: src/index.handler
    events:
      - http:
          path: products
          method: get
      - http:
          path: products
          method: post
      - http:
          path: products/{id}/restock
          method: post
      - http:
          path: products/{id}/sell
          method: post
      - http:
          path: orders
          method: post

resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_PRODUCTS}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_ORDERS}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

custom:
  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      migrate: true

  serverless-offline:
    httpPort: 3000

